<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="stylesheet" href="./css/main.min.css" />
  </head>
  <body>
    <main>
      <section class="contact">
        <div class="container">
          <h2 class="text-title">CONTACT</h2>
          <h3 class="contact__subtitle section__subtitle">GET IN TOUCH</h3>
          <div class="contact__container">
            <form class="contact__form">
              <label class="contact__label" for="user-name">Your Name</label>
              <input
                class="contact__field font-forum"
                type="text"
                id="user-name"
                name="user-name"
              />
              <label class="contact__label" for="user-contact"
                >Contact Number</label
              >
              <input
                class="contact__field font-forum"
                type="tel"
                id="user-contact"
                name="user-contact"
              />
              <label class="contact__label" for="event-date"
                >Wedding / Event Date</label
              >
              <input
                class="contact__field font-forum"
                type="datetime"
                id="event-date"
                name="event-date"
              />
              <label class="contact__label" for="user-message"
                >Tell me about yourself / event plan
              </label>
              <textarea
                class="contact__field contact__field-message font-forum"
                type="text"
                name="user-message"
                id="user-message"
              ></textarea>
              <button class="button__contact button" type="submit">
                Submit
              </button>
            </form>
            <img src="./images/contact-page-section-image.jpg" alt="" />
          </div>
        </div>
      </section>
      <section class="enquire-section">
        <div class="container">
          <h2 class="enquire-section__title font-ephesis">Enquire Now!</h2>
          <h3 class="enquire-section__subtitle">
            “YOU WILL NEVER KNOW THE VALUE OF A MOMENT UNTIL IT BECOMES A
            MEMORY.”
          </h3>
          <div class="enquire-section__contant">
            <div class="enquire-section__info">
              <div class="enquire-section__item">
                <svg class="enquire-section__icon">
                  <use href="./images/icons.svg#icon-email"></use>
                </svg>
                <p class="enquire-section__item-title font-cormorant-gar">
                  EMAIL
                </p>
                <a class="enquire-section__link font-cormorant-gar" href="#"
                  >contact@TessaMorgan.xyz</a
                >
              </div>
              <div class="enquire-section__item">
                <svg class="enquire-section__icon">
                  <use href="./images/icons.svg#icon-location"></use>
                </svg>
                <p class="enquire-section__item-title font-cormorant-gar">
                  ADDRESS
                </p>
                <a class="enquire-section__link font-cormorant-gar" href="#"
                  >5396 North Reese Avenue, Fresno CA 93722</a
                >
              </div>
              <div class="enquire-section__item">
                <svg class="enquire-section__icon">
                  <use href="./images/icons.svg#icon-mobile"></use>
                </svg>
                <p class="enquire-section__item-title font-cormorant-gar">
                  CONTACT
                </p>
                <a class="enquire-section__link font-cormorant-gar" href=""
                  >+1 901 247 5467</a
                >
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
